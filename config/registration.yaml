# TUNE FOR REAL SENSOR: RMSE, overlap, and ICP distances.
# registration_mode: scan_to_scan or scan_to_submap
# The gate is on the ICP-refined full clouds: point-to-plane RMSE of points
# within overlap_distance must be under max_rmse, at least min_overlap of the
# scan must have a close target point, and at least min_fitness of CLIPPER's
# inlier pairs must still agree within inlier_threshold.
# icp_normal_radius must span several scan rings, or ground normals tilt
# toward the sensor and bias the estimate toward zero motion.
mapping:
  ros__parameters:
    registration_mode: scan_to_scan
    submap_radius: 8.0
    min_points: 30
    motion_prediction: true
    max_rmse: 0.06
    min_fitness: 0.2
    inlier_threshold: 0.4
    overlap_distance: 0.3
    min_overlap: 0.5
    icp_enabled: true
    icp_point_to_plane: true
    icp_normal_radius: 1.5
    icp_distance: 0.5
    icp_iterations: 50
    lidar_x: 0.0
    lidar_y: 0.0
    lidar_z: 0.0
    lidar_yaw: 0.0
